syntax = "proto3";

package com.github.regyl.unfriendlyjarvis;

option java_multiple_files = true;
option java_package = "com.github.regyl.unfriendlyjarvis.grpc";
option java_outer_classname = "UserSecretDataProto";

// Service for retrieving user secret data
service UserSecretDataService {
  // Get secret data value by user ID and key
  rpc GetSecretData (GetSecretDataRequest) returns (GetSecretDataResponse);
  
  // Get all secret data for a user
  rpc GetAllSecretData (GetAllSecretDataRequest) returns (GetAllSecretDataResponse);
}

// Request to get secret data by key
message GetSecretDataRequest {
  int64 user_id = 1;  // UUID of the user
  string key = 2;      // Secret key (enum value)
}

// Response with secret data value
message GetSecretDataResponse {
  bool found = 1;
  string value = 2;    // Secret value (only if found = true)
  string error_message = 3;  // Error message (only if found = false)
}

// Request to get all secret data for a user
message GetAllSecretDataRequest {
  int64 user_id = 1;  // UUID of the user
}

// Secret data entry
message SecretDataEntry {
  string key = 1;
  string value = 2;
}

// Response with all secret data
message GetAllSecretDataResponse {
  bool found = 1;
  repeated SecretDataEntry entries = 2;  // List of secret data entries
  string error_message = 3;  // Error message (only if found = false)
}

