version: '3.9'

services:
  redis:
    image: 'redis'
    ports:
      - '6379:6379'
  neo4j:
    image: 'neo4j:4.4.17'
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: 'neo4j/SomeUselessPassword02'
  postgres:
    image: 'postgres:15.3'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: 'idk_user'
      POSTGRES_PASSWORD: 'SomeUselessPassword02'
      POSTGRES_DB: 'uj'
  minio:
    image: 'minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1'
    container_name: minio
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    environment:
      # MinIO Access Key (can be overridden via environment variable MINIO_ROOT_USER)
      MINIO_ROOT_USER: 'idk_user'
      # MinIO Secret Key (can be overridden via environment variable MINIO_ROOT_PASSWORD)
      MINIO_ROOT_PASSWORD: 'SomeUselessPassword02'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data: